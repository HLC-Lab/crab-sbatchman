# Quantum ESPRESSO pw.x alone on 2 nodes (4 ranks per node).
#
# Setup: `./install.sh` already ran `sbatchman init` in this folder and filled the configs
# file `.local/configs.leonardo.yaml` (account, partition, QOS and the CRAB path). Before
# launching, run `source env.sh` from the umbrella root: it activates the environment and
# exports SBATCHMAN_CLUSTER_NAME=leonardo, which must equal the cluster block name
# (`leonardo`) of the configs file. Then, from this folder, check what SbatchMan would submit
# and launch:
#   sbatchman launch -f qe-alone.yaml --dry-run
#   sbatchman launch -f qe-alone.yaml
# `configs.leonardo.yaml` defines one SbatchMan config per node count for QE, named crab_qe_<nodes>;
# its `nodes` list must hold every value of `nodes` below.
#
# Measures: Quantum ESPRESSO pw.x alone on 2 nodes: the reference run. The QE module on Leonardo is
# a GPU build, so these jobs use the GPU config (`crab_qe_<nodes>`, 4 GPUs per node). Needs QE
# registered with `crab setup` (a module install is fine). The input (a silicon SCF run) and its
# pseudopotential are read from the qe/ folder next to this file, see qe/README.md; the metric is `wall_time` in
# seconds.
configs: ../../.local/configs.leonardo.yaml
variables:
  nodes:
    - 2
jobs:
  - config: crab_qe_{nodes}
    tag: qe-alone-{nodes}n
    # "retain_files": false: CRAB deletes the run folder of a successful run (pw.out goes with it, the
    # metrics stay in the results); a failed run keeps its folder for debugging.
    # The heredoc is unquoted (<<JSON) so the shell expands $SBATCHMAN_WD, the folder you launch from.
    # Keep every other `$` and backtick out of the JSON.
    preprocess: |
      mkdir -p "$SBATCHMAN_JOB_DIR"
      cat > "$SBATCHMAN_JOB_DIR/config.json" <<JSON
      {
        "schema_version": 2,
        "global_options": {
          "numnodes": "{nodes}",
          "ppn": "4",
          "retain_files": false,
          "name": "qe-alone-{nodes}n"
        },
        "experiments": {
          "run": {
            "apps": {
              "0": {
                "path": "quantum-espresso/pw/v7.py",
                "args": "",
                "input_file": "$SBATCHMAN_WD/qe/si-scf.in",
                "pseudo_dir": "$SBATCHMAN_WD/qe",
                "collect": true,
                "start": "0",
                "end": ""
              }
            }
          }
        }
      }
      JSON
    command: crab worker --workdir "$SBATCHMAN_JOB_DIR"
