# Smoke test: an all-to-all alone on 2 nodes (4 ranks per node).
#
# Setup: `./install.sh` already ran `sbatchman init` in this folder and filled the configs
# file `.local/configs.leonardo.yaml` (account, partition, QOS and the CRAB path). Before
# launching, run `source env.sh` from the umbrella root: it activates the environment and
# exports SBATCHMAN_CLUSTER_NAME=leonardo, which must equal the cluster block name
# (`leonardo`) of the configs file. Then, from this folder, check what SbatchMan would submit
# and launch:
#   sbatchman launch -f smoke.yaml --dry-run
#   sbatchman launch -f smoke.yaml
# `configs.leonardo.yaml` defines one SbatchMan config per node count, named crab_run_<nodes>; its
# `nodes` list must hold every value of `nodes` below.
#
# Measures: the all-to-all (Blink alltoall_b) with no other traffic. Run it first: it is small
# enough for a debug queue and shows that the project, the config file and CRAB's worker all work.
# The victim sends 1 MiB messages (-msgsize 1048576) and measures 100 iterations per run
# (-iter 100). Change those flags in "args" to try another size or iteration count.
configs: ../../.local/configs.leonardo.yaml
variables:
  nodes:
    - 2
jobs:
  - config: crab_run_{nodes}
    tag: a2a-smoke-{nodes}
    preprocess: |
      mkdir -p "$SBATCHMAN_JOB_DIR"
      cat > "$SBATCHMAN_JOB_DIR/config.json" <<'JSON'
      {
        "schema_version": 2,
        "global_options": {
          "numnodes": "{nodes}",
          "ppn": "4",
          "name": "a2a-smoke-{nodes}"
        },
        "experiments": {
          "run": {
            "apps": {
              "0": {
                "path": "blink/alltoall/alltoall_b.py",
                "args": "-msgsize 1048576 -iter 100",
                "collect": true,
                "start": "0",
                "end": ""
              }
            }
          }
        }
      }
      JSON
    command: crab worker --workdir "$SBATCHMAN_JOB_DIR"
