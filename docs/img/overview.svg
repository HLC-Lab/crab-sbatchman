<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="overview-title overview-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <title id="overview-title">How the laptop, the cluster login node and the Slurm jobs work together</title>
  <desc id="overview-desc">The laptop runs the dashboard, fetches results and plots them. It talks to the cluster login node over ssh and rsync. The login node holds the umbrella, with CRAB and SbatchMan, and submits Slurm jobs with sbatch. The jobs run the benchmark apps. The results folder is copied back to the laptop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#323f4b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="260" rx="8" fill="#f5f5f4"/>

  <rect x="20" y="25" width="190" height="150" rx="8" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
  <text x="115" y="52" text-anchor="middle" font-weight="bold" font-size="14" fill="#1f2933">LAPTOP</text>
  <text x="115" y="88" text-anchor="middle" fill="#1f2933">crab web (dashboard)</text>
  <text x="115" y="115" text-anchor="middle" fill="#1f2933">sbatchman fetch</text>
  <text x="115" y="142" text-anchor="middle" fill="#1f2933">sbatchman visualize</text>

  <rect x="290" y="25" width="200" height="150" rx="8" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
  <text x="390" y="52" text-anchor="middle" font-weight="bold" font-size="14" fill="#1f2933">CLUSTER LOGIN NODE</text>
  <text x="390" y="88" text-anchor="middle" fill="#1f2933">umbrella: CRAB + SbatchMan</text>
  <text x="390" y="115" text-anchor="middle" fill="#1f2933">sbatchman launch</text>
  <text x="390" y="142" text-anchor="middle" fill="#1f2933">benchmarks/ and results</text>

  <rect x="580" y="25" width="120" height="150" rx="8" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
  <text x="640" y="52" text-anchor="middle" font-weight="bold" font-size="14" fill="#1f2933">SLURM JOBS</text>
  <text x="640" y="95" text-anchor="middle" fill="#1f2933">benchmark apps</text>
  <text x="640" y="122" text-anchor="middle" fill="#1f2933">on compute nodes</text>

  <line x1="214" y1="100" x2="286" y2="100" stroke="#323f4b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="250" y="90" text-anchor="middle" fill="#1f2933">ssh, rsync</text>

  <line x1="494" y1="100" x2="576" y2="100" stroke="#323f4b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="535" y="90" text-anchor="middle" fill="#1f2933">sbatch</text>

  <path d="M 390 179 L 390 218 L 115 218 L 115 180" fill="none" stroke="#323f4b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="252" y="240" text-anchor="middle" fill="#1f2933">results folder, copied back for the plots</text>
</svg>
