name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # macOS ships bash 3.2 as /bin/bash; it stays non-blocking until it is checked on a real Mac.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CRAB and the test tools
        run: pip install -e ./CRAB pytest pyyaml
      - name: Tests
        run: python -m pytest -q

  without-submodules:
    name: Without the submodules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test tools
        run: pip install pytest pyyaml
      - name: Tests that need no CRAB checkout
        run: |
          python -m pytest -q \
            --deselect tests/test_benchmarks.py::test_every_embedded_config_passes_crab_validation \
            --deselect tests/test_docs.py::test_relative_links_resolve_and_anchors_match_a_heading \
            --deselect tests/test_docs.py::test_repo_paths_in_code_exist
